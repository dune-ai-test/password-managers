# Aegis — Gradle properties.

# Keep the build inside the 7 GB GitHub-hosted runner envelope. 3 GB is what the
# Compose toolchain needs comfortably; the daemon is disabled on CI (--no-daemon).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false

kotlin.code.style=official
